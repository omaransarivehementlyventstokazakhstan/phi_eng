[package]
name = "phieng-math"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Math utilities for physics engine"
documentation = "https://docs.rs/phieng-math"
homepage = "https://github.com/omaransarivehementlyventstokazakhstan/phi_eng"
keywords = ["physics", "math", "game-development"]
categories = ["physics", "math", "game-development"]

[dependencies]
glam = { workspace = true }

[features]
default = []
# SIMD-accelerated math paths. Off by default for MSRV compatibility
# (std::simd is still unstable; this feature uses std::arch intrinsics
# on x86_64/x86 and a scalar fallback everywhere else).
simd = []
