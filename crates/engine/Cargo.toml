[package]
name = "phieng"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High performance physics engine for 2D and 3D games"
documentation = "https://docs.rs/phieng"
homepage = "https://github.com/omaransarivehementlyventstokazakhstan/phi_eng"
keywords = ["physics", "engine", "game-development"]
categories = ["physics", "game-development"]

[dependencies]
phieng-math = { path = "../math", version = "0.4.0" }
phieng-collision = { path = "../collision", version = "0.4.0" }
phieng-broadphase = { path = "../broadphase", version = "0.4.0" }
phieng-dynamics = { path = "../dynamics", version = "0.4.0" }
glam = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.0"
crc32fast = "1.4"

[features]
default = []
# Per-phase wall-clock instrumentation, forwarded to the dynamics crate.
# Off by default: the default build's public API and its trajectory
# hashes are exactly what they were. With it, the `bench_phases` example
# can print where a step's time goes.
phase-timing = ["phieng-dynamics/phase-timing", "phieng-broadphase/phase-timing"]

[lib]
name = "phieng"
# rlib keeps `cargo test` / dependents working; cdylib produces the
# native dynamic library (phieng.dll / .so / .dylib) for C# P/Invoke.
crate-type = ["cdylib", "rlib"]
