[package]
name = "phieng"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High performance physics engine for 2D and 3D games"
documentation = "https://docs.rs/phieng"
homepage = "https://github.com/omaransarivehementlyventstokazakhstan/phi_eng"
keywords = ["physics", "engine", "game-development"]
categories = ["physics", "game-development"]

[dependencies]
phieng-math = { path = "../math", version = "0.3.0" }
phieng-collision = { path = "../collision", version = "0.3.0" }
phieng-broadphase = { path = "../broadphase", version = "0.3.0" }
phieng-dynamics = { path = "../dynamics", version = "0.3.0" }
glam = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.0"
crc32fast = "1.4"

[lib]
name = "phieng"
# rlib keeps `cargo test` / dependents working; cdylib produces the
# native dynamic library (phieng.dll / .so / .dylib) for C# P/Invoke.
crate-type = ["cdylib", "rlib"]
