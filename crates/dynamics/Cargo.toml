[package]
name = "phieng-dynamics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rigid body dynamics and constraint solver"
documentation = "https://docs.rs/phieng-dynamics"
homepage = "https://github.com/omaransarivehementlyventstokazakhstan/phi_eng"
keywords = ["physics", "dynamics", "game-development"]
categories = ["physics", "game-development"]

[dependencies]
phieng-math = { path = "../math", version = "0.4.0" }
phieng-collision = { path = "../collision", version = "0.4.0" }
phieng-broadphase = { path = "../broadphase", version = "0.4.0" }
glam = { workspace = true }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"

[features]
default = []
# Per-phase wall-clock instrumentation for the benchmark harness.
#
# Off by default: without it the step pipeline contains no clock reads
# and no branches, and the public API is byte-for-byte the same as the
# default build. With it, `World2`/`World3` accumulate per-phase
# timings that `World2::phase_timings` / `World3::phase_timings` expose.
#
# The instrumentation never touches the simulation state, so the
# trajectory hashes are identical with the feature on and off.
phase-timing = []
