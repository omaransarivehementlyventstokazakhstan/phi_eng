name: ci

on:
  push:
  pull_request:

jobs:
  rust-lint:
    runs-on: ${{ matrix.os }}
    # Fail fast if a lint regresses into a hang instead of burning the
    # 6h default (a pathological broadphase case once did exactly that).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache the cargo registry + target dir: without it every job
      # rebuilds all deps from scratch, which dominated CI wall time.
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doc links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-test:
    runs-on: ${{ matrix.os }}
    # Split from lint: fmt + clippy-all-targets + doc + a full debug
    # test build and run no longer fit one 30-minute budget (green runs
    # were being killed at exactly 30:00 with "The operation was
    # canceled"). Each half keeps a fail-fast timeout that fits it.
    # `--lib --tests` skips the 4 examples (still compiled by clippy
    # --all-targets); there are no bins/benches/doctests to lose.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (debug)
        # --lib --tests skips compiling the 4 examples (clippy
        # --all-targets still builds them); identical test coverage,
        # fewer Windows debug links.
        run: cargo test --workspace --lib --tests

  # Release-optimized soak: determinism hashes and allocation counts must
  # hold unchanged under optimization (where vectorization / FMA
  # contraction, if it ever appeared, would change float results).
  rust-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (release)
        run: cargo test --workspace --release

  csharp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-gnu' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build native (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --target x86_64-unknown-linux-gnu -p phieng
      - name: Stage native linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p src/PhiEng.Native/runtimes/linux-x64/native
          cp target/x86_64-unknown-linux-gnu/release/libphieng.so src/PhiEng.Native/runtimes/linux-x64/native/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Tests
        run: dotnet test tests/PhiEng.Tests/PhiEng.Tests.csproj
      - name: Parity check
        run: python tools/check_test_parity.py

  # Version alignment: the Cargo workspace version and the .NET shared
  # version must agree (single release version across both ecosystems).
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Cargo and MSBuild versions agree
        run: |
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          props_ver=$(grep -m1 '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          echo "Cargo: $cargo_ver, MSBuild: $props_ver"
          test "$cargo_ver" = "$props_ver"

  # Minimum supported Rust version (1.78).
  # Only the library targets are checked: examples/benches may use newer sugar.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.78
      - name: MSRV build (libs only)
        run: cargo build --workspace --lib

  # Portable bench smoke: trajectory hash + allocation census must match
  # the recorded profile. Timing is NOT gated (CI runners are noisy).
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bench smoke (hash + allocs)
        run: cargo run -p phieng --example bench_large --release

  # Native-CPU bench: informational only, never gating (runner noise).
  bench-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native bench (informational)
        run: ./tools/build-native.sh --bench

  # From-scratch host example: a broken example is a broken build.
  host-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # No `cache: true` here: this project has no PackageReference (only
      # local ProjectReferences), so ~/.nuget/packages is never created and
      # the setup-dotnet cache post-step errors ("folder does not exist").
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Host headless smoke
        run: dotnet run --project examples/host/PhiEng.Host.csproj -- --smoke --steps 600

  # README smoke: validate hello samples compile and run (5-min hello-worlds).
  # One shared native build + one restore, reused across all sample runs.
  readme-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build native (ubuntu)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p phieng
      - name: Stage native linux
        run: |
          mkdir -p src/PhiEng.Native/runtimes/linux-x64/native
          cp target/x86_64-unknown-linux-gnu/release/libphieng.so src/PhiEng.Native/runtimes/linux-x64/native/
      # No `cache: true` here: the sample projects have no PackageReference
      # (only local ProjectReferences), so ~/.nuget/packages is never
      # created and the setup-dotnet cache post-step errors.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: hello-2d
        run: dotnet run --project samples/hello-2d/hello-2d.csproj
      - name: hello-3d
        run: dotnet run --project samples/hello-3d/hello-3d.csproj
      - name: hello-joint
        run: dotnet run --project samples/hello-joint/hello-joint.csproj
      - name: hello-snapshot
        run: dotnet run --project samples/hello-snapshot/hello-snapshot.csproj
      - name: hello-native
        run: dotnet run --project samples/hello-native/hello-native.csproj
