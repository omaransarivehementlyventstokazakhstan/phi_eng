[workspace]
resolver = "2"
members = [
    "crates/math",
    "crates/collision",
    "crates/broadphase",
    "crates/quantum",
    "crates/dynamics",
    "crates/engine",
]
exclude = ["target"]

[workspace.package]
version = "0.5.0-dev"
edition = "2021"
rust-version = "1.78"
license = "Unlicense"
authors = ["Omar"]
repository = "https://github.com/omaransarivehementlyventstokazakhstan/phi_eng"

[workspace.dependencies]
glam = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
debug-assertions = false
panic = "abort"
opt-level = 3

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true
